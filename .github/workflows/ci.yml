# CI for the thesis baseline (nec_baseline/). Runs the moment this repo gets a
# GitHub remote — nothing to configure. Network-dependent tests skip themselves
# (NEC_NETWORK_TESTS gate) and tests that need the licensed CRSP files skip
# without Quant Model/Data/ (never in the repo), so the suite is hermetic here.
name: nec-baseline

on:
  push:
    paths: ["nec_baseline/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["nec_baseline/**", ".github/workflows/ci.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nec_baseline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # statsmodels is the Hamilton gate's estimator: without it the whole
          # markov-gate suite importorskips and CI goes green having tested
          # none of it (measured: 195 passed / 4 skipped vs 212 / 3 locally).
          # pyarrow: the CRSP layer's fixture tests (invented numbers) run here
          pip install numpy pandas pytest ruff mypy matplotlib statsmodels pyarrow
      - name: Lint (ruff)
        run: python -m ruff check nec_moe/ tests/ scripts/ run_experiment.py
      - name: Type-check (mypy)
        run: python -m mypy nec_moe/ run_experiment.py
      - name: Tests (offline suite)
        run: python -m pytest tests/ -q
